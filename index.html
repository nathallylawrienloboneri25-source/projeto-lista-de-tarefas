<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Minha Lista de Tarefas</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <div class="cabecalho">
            <span class="icone">✨</span>

            <h1>Minha Lista de Tarefas</h1>

            <p>Organize seu dia, uma tarefa de cada vez. 💗</p>
        </div>

        <div class="entrada">

            <input
                type="text"
                id="tarefaInput"
                placeholder="Digite uma nova tarefa..."
            >

            <button id="botaoAdicionar">
                + Adicionar
            </button>

        </div>

        <div id="mensagemVazia" class="mensagem-vazia">
            ✨ Nenhuma tarefa por enquanto.<br>
            Adicione uma nova tarefa para começar!
        </div>

        <ul id="listaTarefas"></ul>

        <div class="estatisticas">

    <div class="estatistica">
        <strong id="totalTarefas">0</strong>
        <span>Total</span>
    </div>

    <div class="estatistica">
        <strong id="tarefasConcluidas">0</strong>
        <span>Concluídas</span>
    </div>

    <div class="estatistica">
        <strong id="tarefasPendentes">0</strong>
        <span>Pendentes</span>
    </div>

</div>

<div class="rodape">
    <p id="contador">Tarefas pendentes: 0</p>
</div>
    <

    </main>

    <script src="script.js"></script>

</body>

</html>
